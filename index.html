<meta charset="utf-8">
<title>Умиляй и заправляй в Telegram</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0613">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --void:#0a0613; --edge:#3a2a5e; --ink:#f6eeff; --dim:#9b8ac2;
    --pink:#ff3d7f; --cyan:#34dfff; --gold:#ffc93c; --green:#4ade8a;
    --pad: clamp(104px, 30vmin, 168px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0; padding:0; background:var(--void); overflow:hidden;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; color:var(--ink)}

  /* игровое поле занимает весь экран; управление лежит поверх нижних углов */
  #app{position:fixed; inset:0; overflow:hidden}
  #stage{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#06040c}
  canvas{display:block; max-width:100%; max-height:100%; aspect-ratio:16/9;
    image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none}
  .scan{position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0 1px, rgba(0,0,0,0) 1px 3px);
    mix-blend-mode:multiply}

  /* два геймпада: слева ходьба, справа приёмы — раскладка повторяет клавиши */
  .gp{display:none; position:absolute; bottom:calc(10px + env(safe-area-inset-bottom));
    width:var(--pad); height:var(--pad);
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    gap:4px; z-index:5}
  html.playing .gp{display:grid}
  #padL{left:calc(10px + env(safe-area-inset-left))}
  #padR{right:calc(10px + env(safe-area-inset-right))}
  .gp .up{grid-area:1/2/2/3}
  .gp .left{grid-area:2/1/3/2}
  .gp .right{grid-area:2/3/3/4}
  .gp .down{grid-area:3/2/4/3}
  .gp .mid{grid-area:2/2/3/3}

  .gp button{
    font-family:inherit; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:1px; padding:0; cursor:pointer; touch-action:none;
    border:2px solid #5a4a86; border-radius:50%; background:rgba(34,22,57,.82);
    color:var(--ink); backdrop-filter:blur(2px); transition:transform .05s, background .05s;
  }

  .gp .ico{font-size:clamp(15px,4.4vmin,22px); line-height:1}
  .gp i{font-style:normal; font-size:8px; letter-spacing:.03em; opacity:.85; font-weight:700}
  .gp button.on{transform:scale(.92)}
  .dirbtn{color:var(--cyan); border-color:#35608f}
  .dirbtn.on{background:var(--cyan); color:#04202a}
  .bow{color:var(--green); border-color:#2f6b5c; background:rgba(20,44,38,.82)}
  .bow .ico{font-size:clamp(13px,3.8vmin,19px)}
  .bow.on{background:var(--green); color:#042014}
  .c1,.c2{color:#ffb9d3; border-color:#7a2a55}
  .c1.on,.c2.on{background:var(--pink); color:#3a0a24}
  .c3{color:#ffd98a; border-color:#7a5a22}
  .c3.on{background:var(--gold); color:#2a1a00}
  /* супер показывается только когда шкала обаяния полна */
  .sup{display:none; color:#2a1a00; border-color:#ffe9a8; background:rgba(255,201,60,.92);
    animation:ready 1s ease-in-out infinite}
  .sup i{font-size:7px; font-weight:700}
  html.superready .sup{display:flex}
  .sup.on{background:#fff0f6; border-color:var(--pink)}
  @keyframes ready{0%,100%{box-shadow:0 0 0 0 rgba(255,201,60,.55)}50%{box-shadow:0 0 0 7px rgba(255,201,60,0)}}
  @media (prefers-reduced-motion:reduce){ .sup{animation:none} }

  /* вертикальный телефон: разворачиваем игру целиком, чтобы экран был длинным */
  html.rot #app{
    width:100vh; height:100vw; width:100dvh; height:100dvw;
    transform-origin:top left; transform:rotate(90deg) translateY(-100%);
  }
  html.rot #padL{left:calc(44px + env(safe-area-inset-top))}   /* под шапкой Telegram */
  #rotHint{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    z-index:20; padding:7px 13px; border-radius:999px; pointer-events:none; font-size:12px;
    background:rgba(20,11,38,.92); border:1px solid var(--edge); color:var(--ink);
    font-size:13px; letter-spacing:.04em; white-space:nowrap; display:none;
    box-shadow:0 6px 24px rgba(0,0,0,.5);
  }
  #rotHint b{color:var(--gold); font-weight:700}
  html.rot #rotHint.show{display:block; animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.95}50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){ html.rot #rotHint.show{animation:none} }
</style>

<div id="app">
  <div id="stage">
    <canvas id="scr" width="480" height="270" aria-label="Игровой экран"></canvas>
    <div class="scan"></div>
  </div>

  <div class="gp" id="padL">
    <button class="dirbtn up" data-k="KeyW" aria-label="Прыжок"><span class="ico">▲</span></button>
    <button class="dirbtn left" data-k="KeyA" aria-label="Назад"><span class="ico">◀</span></button>
    <button class="dirbtn right" data-k="KeyD" aria-label="Вперёд"><span class="ico">▶</span></button>
    <button class="mid bow" data-k="KeyS" aria-label="Поклон"><span class="ico">▼</span></button>
  </div>

  <div class="gp" id="padR">
    <button class="sup mid" data-k="ArrowUp" aria-label="Супер-приём"><span class="ico">⭐</span><i>СУПЕР</i></button>
    <button class="c1 left" data-k="ArrowLeft" aria-label="Голос"><span class="ico">💬</span><i>ГОЛОС</i></button>
    <button class="c3 right" data-k="ArrowRight" aria-label="Шоколадка"><span class="ico">🍫</span><i>ШОКОЛАД</i></button>
    <button class="c2 down" data-k="ArrowDown" aria-label="Букет"><span class="ico">💐</span><i>БУКЕТ</i></button>
  </div>
</div>
<div id="rotHint">↻ <b>Поверните телефон</b> — игра уже развёрнута</div>

const GCACHE = {};
for(const ch in GLYPHS){
  const pts = [];
  GLYPHS[ch].forEach((row,y)=>{ for(let x=0;x<5;x++) if(row[x]==='1') pts.push([x,y]); });
  GCACHE[ch] = pts;
}
function normCh(c){
  const u = c.toUpperCase();
  if(u==='Ё') return 'Е';
  if(u==='—'||u==='–') return '-';
  if(u==='"'||u==='“'||u==='”') return '«';
  return GCACHE[u] ? u : (GCACHE[c] ? c : ' ');
}
function textW(str, s=1){ return str.length*6*s - s; }
function text(str, x, y, o={}){
  const s = o.scale||1, col = o.color||'#fff';
  let px = x;
  if(o.align==='center') px = Math.round(x - textW(str,s)/2);
  else if(o.align==='right') px = Math.round(x - textW(str,s));
  px = Math.round(px); y = Math.round(y);
  if(o.shadow){
    const d = o.shadowDist||s;
    drawStr(str, px+d, y+d, s, o.shadow);
  }
  if(o.outline){
    for(const [dx,dy] of [[-s,0],[s,0],[0,-s],[0,s]]) drawStr(str, px+dx, y+dy, s, o.outline);
  }
  drawStr(str, px, y, s, col);
  return px;
}
function drawStr(str, x, y, s, col){
  ctx.fillStyle = col;
  for(let i=0;i<str.length;i++){
    const pts = GCACHE[normCh(str[i])];
    if(!pts) continue;
    const ox = x + i*6*s;
    for(let j=0;j<pts.length;j++) ctx.fillRect(ox+pts[j][0]*s, y+pts[j][1]*s, s, s);
  }
}

/* ---------- 2. Звук ---------- */
let AC = null, musicOn = true, sfxOn = true;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=false; } }
  if(AC && AC.state==='suspended') AC.resume();
  return AC || null;
}
function beep(freq, dur=0.07, type='square', vol=0.05, slide=0){
  const a = ac(); if(!a || !sfxOn) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), a.currentTime+dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02);
}
function noise(dur=0.12, vol=0.05){
  const a = ac(); if(!a || !sfxOn) return;
  const n = Math.floor(a.sampleRate*dur);
  const buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1-i/n);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain(); g.gain.value = vol;
  src.connect(g); g.connect(a.destination); src.start();
}

/* простенькая чиптюн-петля */
const MUS = {
  next: 0, step: 0,
  patterns: {
    menu: { bpm: 104, bass:[0,0,7,0,5,0,3,0], lead:[12,null,15,19,null,15,12,null] },
    fight:{ bpm: 150, bass:[0,0,3,0,5,0,3,2], lead:[12,15,19,22,19,15,12,10] },
    win:  { bpm: 130, bass:[0,5,7,12,0,5,7,12], lead:[19,22,24,26,24,22,19,null] }
  },
  key: 110,
  tick(name){
    const a = ac(); if(!a || !musicOn) return;
    const p = this.patterns[name] || this.patterns.menu;
    const spb = 60/p.bpm/2;
    if(a.currentTime < this.next) return;
    if(this.next === 0) this.next = a.currentTime + 0.05;
    const t = this.next;
    const i = this.step % 8;
    const semi = n => this.key * Math.pow(2, n/12);
    const bo = a.createOscillator(), bg = a.createGain();
    bo.type='triangle'; bo.frequency.setValueAtTime(semi(p.bass[i])/2, t);
    bg.gain.setValueAtTime(.055, t); bg.gain.exponentialRampToValueAtTime(.0001, t+spb*0.9);
    bo.connect(bg); bg.connect(a.destination); bo.start(t); bo.stop(t+spb);
    const ln = p.lead[i];
    if(ln !== null && ln !== undefined){
      const lo = a.createOscillator(), lg = a.createGain();
      lo.type='square'; lo.frequency.setValueAtTime(semi(ln), t);
      lg.gain.setValueAtTime(.026, t); lg.gain.exponentialRampToValueAtTime(.0001, t+spb*0.8);
      lo.connect(lg); lg.connect(a.destination); lo.start(t); lo.stop(t+spb);
    }
    this.next = t + spb; this.step++;
  },
  reset(){ this.next = 0; this.step = 0; }
};

/* ---------- 2b. Telegram Mini App ---------- */
const TG = (function(){
  const t = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined)
    ? window.Telegram.WebApp : null;
  if(t){
    const safe = fn => { try{ fn(); }catch(e){} };
    safe(()=>t.ready());
    safe(()=>t.expand());
    safe(()=>t.setHeaderColor('#0a0613'));
    safe(()=>t.setBackgroundColor('#0a0613'));
    safe(()=>t.disableVerticalSwipes());
    safe(()=>t.requestFullscreen());
  }
  const u = t && t.initDataUnsafe ? t.initDataUnsafe.user : null;
  let name = u && u.first_name ? String(u.first_name) : '';
  name = Array.from(name.toUpperCase())
    .map(c => c === 'Ё' ? 'Е' : c)
    .filter(c => GCACHE[c] !== undefined)
    .join('').trim().slice(0,12);
  return {
    api: t,
    name: name,
    backShown: false,
    haptic(kind){ try{ this.api.HapticFeedback.impactOccurred(kind); }catch(e){} },
    notify(kind){ try{ this.api.HapticFeedback.notificationOccurred(kind); }catch(e){} },
    loadBest(cb){
      let local = 0;
      try{ local = parseInt(localStorage.getItem('umilyay_best')||'0',10)||0; }catch(e){}
      cb(local);
      try{
        this.api.CloudStorage.getItem('best', (err,val)=>{
          if(!err && val) cb(parseInt(val,10)||0);
        });
      }catch(e){}
    },
    saveBest(v){
      try{ localStorage.setItem('umilyay_best', String(v)); }catch(e){}
      try{ this.api.CloudStorage.setItem('best', String(v)); }catch(e){}
    },
    send(obj){
      try{ this.api.sendData(JSON.stringify(obj)); return true; }catch(e){ return false; }
    },
    syncBack(show){
      if(!this.api || !this.api.BackButton) return;
      if(show === this.backShown) return;
      this.backShown = show;
      try{ show ? this.api.BackButton.show() : this.api.BackButton.hide(); }catch(e){}
    }
  };
})();
if(TG.api && TG.api.BackButton){

const hintEl = () => document.getElementById('rotHint');
let hintTimer = 0;
function layout(){
  const portrait = window.innerHeight > window.innerWidth;
  document.documentElement.classList.toggle('rot', portrait);
  // растягиваем экран игры на всю доступную область, сохраняя 16:9
  const availW = portrait ? window.innerHeight : window.innerWidth;
  const availH = portrait ? window.innerWidth : window.innerHeight;
  const s = Math.max(0.2, Math.min(availW / W, availH / H));
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  const h = hintEl();
  if(!h) return;
  if(portrait){
    h.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(()=>h.classList.remove('show'), 7000);
  } else h.classList.remove('show');
}

const taps = [];
cv.addEventListener('pointerdown', e=>{
  e.preventDefault(); ac();
  const h = hintEl(); if(h) h.classList.remove('show');
  let x, y;
  if(e.target === cv && typeof e.offsetX === 'number' && cv.clientWidth){
    // offset учитывает CSS-поворот, поэтому работает и в развёрнутом режиме
    x = e.offsetX / cv.clientWidth * W;
    y = e.offsetY / cv.clientHeight * H;
  } else {
    const r = cv.getBoundingClientRect();
    x = (e.clientX - r.left) / r.width * W;
    y = (e.clientY - r.top) / r.height * H;
  }
  taps.push({x, y});
}, {passive:false});

/* ---------- 5. Утилиты рисования ---------- */
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mix(h1,h2,t){
  const a = hex2rgb(h1), b = hex2rgb(h2);
  return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
}
function R(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function bands(x,y,w,h,c1,c2,n){
  const step = h/n;
  for(let i=0;i<n;i++) R(x, y+i*step, w, Math.ceil(step)+1, mix(c1,c2,i/(n-1||1)));
}
function seg(a,b,t,col){
  const dx=b.x-a.x, dy=b.y-a.y;
  const steps = Math.max(1, Math.ceil(Math.hypot(dx,dy)/1.5));
  ctx.fillStyle = col;
  for(let i=0;i<=steps;i++){
    const x = a.x+dx*i/steps, y = a.y+dy*i/steps;
    ctx.fillRect(Math.round(x-t/2), Math.round(y-t/2), t, t);
  }
}
function limb(a,b,t,col,bendX=0,bendY=0){
  const mid = {x:(a.x+b.x)/2+bendX, y:(a.y+b.y)/2+bendY};
  seg(a,mid,t,col); seg(mid,b,t,col);
}
function heartPath(x,y,s,col){
  ctx.fillStyle = col;
  const px = (a,b,w,h)=>ctx.fillRect(Math.round(x+a*s),Math.round(y+b*s),Math.ceil(w*s),Math.ceil(h*s));
  px(-3,-3,2,2); px(1,-3,2,2);
  px(-4,-1,9,2);
  px(-3,1,7,1); px(-2,2,5,1); px(-1,3,3,1); px(0,4,1,1);
}

function faceDraw(pal, mood, mode, t){
  // голова рисуется в локальных координатах вокруг (0,0) = центр головы
  const eyeY = -1;
  const blush = clamp((mood-25)/75, 0, 1);
  R(-8,-9,16,17, pal.skin);
  R(-8,-9,16,2, mix(pal.skin,'#ffffff',.25));
  R(-9,-6,1,10, pal.skin);
  R(8,-6,1,10, pal.skin);
  // румянец
  if(blush>0.05){
    const c = `rgba(255,90,140,${(0.25+blush*0.55).toFixed(2)})`;
    R(-7,eyeY+4,4,3,c); R(3,eyeY+4,4,3,c);
  }
  const ink = '#2a1f2e';
  if(mode==='shock'){
    R(-5,eyeY-1,3,4, ink); R(2,eyeY-1,3,4, ink);
    R(-2,eyeY+6,5,3, ink);
  } else if(mode==='frown'){
    R(-6,eyeY-3,5,1, ink); R(1,eyeY-3,5,1, ink);
    R(-5,eyeY,3,2, ink); R(2,eyeY,3,2, ink);
    R(-3,eyeY+6,7,1, ink);
  } else if(mode==='calm'){
    R(-6,eyeY+1,4,1, ink); R(2,eyeY+1,4,1, ink);
    R(-3,eyeY+5,6,1, ink); R(-4,eyeY+4,1,1, ink); R(3,eyeY+4,1,1, ink);
  } else if(mode==='melt'){
    R(-6,eyeY,4,1, ink); R(2,eyeY,4,1, ink);
    R(-3,eyeY+4,7,4, ink);
    R(-6,eyeY+2,2,5,'#7fd6ff'); R(4,eyeY+2,2,5,'#7fd6ff');
  } else if(mode==='smile'){
    R(-5,eyeY,2,2, ink); R(3,eyeY,2,2, ink);
    R(-4,eyeY+5,8,1, ink); R(-5,eyeY+4,1,1, ink); R(4,eyeY+4,1,1, ink);
  } else if(mode==='wink'){
    R(-5,eyeY,2,2, ink); R(3,eyeY+1,3,1, ink);
    R(-4,eyeY+5,8,1, ink);
  } else {
    const blink = (Math.floor(t/45)%7===0) && (t%45<5);
    if(blink){ R(-5,eyeY+1,3,1, ink); R(3,eyeY+1,3,1, ink); }
    else { R(-5,eyeY,2,3, ink); R(3,eyeY,2,3, ink); }
    R(-2,eyeY+5,5,1, ink);
  }
}

/* Позы */
function poseFor(f, t){
  const c = f.char;
  const p = {
    dx:0, bob:0, face:'idle', prop:null, propPos:{x:0,y:0},
    hip:{x:0,y:-28}, sh:{x:0,y:-52}, head:{x:0,y:-62},
    footF:{x:8,y:0}, footB:{x:-8,y:0},
    handF:{x:12,y:-42}, handB:{x:-7,y:-40}
  };
  const st = f.state;
  const mood = f.mood;
  if(st==='idle' || st==='walk'){
    if(st==='walk'){
      const ph = f.animT*0.3;
      p.footF = {x: 8+Math.cos(ph)*8, y: -Math.max(0,Math.sin(ph))*5};
      p.footB = {x: -8-Math.cos(ph)*8, y: -Math.max(0,Math.sin(ph+Math.PI))*5};
      p.bob = -Math.abs(Math.sin(ph))*1.5;
      p.handF = {x: 12-Math.cos(ph)*3, y:-42};
      p.handB = {x: -7+Math.cos(ph)*3, y:-40};
    } else {
      const b = Math.sin(f.animT*0.08)*1.3;
      p.bob = b;
      p.handF = {x:12, y:-42+b*1.5};
      p.handB = {x:-7, y:-40+b};
    }
    p.face = mood>70 ? 'shock' : 'idle';
  } else if(st==='jump'){
    p.footF={x:11,y:-10}; p.footB={x:-5,y:-14};
    p.handF={x:10,y:-58}; p.handB={x:-9,y:-56};
    p.face='smile';
  } else if(st==='block'){
    // вежливый поклон: корпус вперёд, рука к сердцу, вторая отведена назад
    const d = Math.min(1, f.animT/7);
    p.bob = 4*d;
    p.hip = {x:-3*d, y:-28};
    p.sh = {x:8*d, y:-50};
    p.head = {x:12*d, y:-58};
    p.footF={x:8,y:0}; p.footB={x:-12,y:0};
    p.handF={x:9*d+2, y:-45};
    p.handB={x:-12*d-4, y:-34+3*d};
    p.face='calm';
  } else if(st==='hit'){
    const k = clamp(f.stun/14,0,1);
    p.dx = -3*k; p.bob = 1;
    p.head={x:-4*k, y:-62-1*k};
    p.sh={x:-3*k,y:-52};
    p.handF={x:14,y:-52}; p.handB={x:-13,y:-48};
    p.footF={x:10,y:0}; p.footB={x:-11,y:0};
    p.face = mood>75 ? 'melt' : 'shock';
  } else if(st==='ko'){
    const k = clamp(f.animT/70,0,1);
    p.bob = 26*k;
    p.head={x:0, y:-62+10*k};
    p.sh={x:0,y:-52+4*k};
    p.footF={x:12+6*k,y:0}; p.footB={x:-12-6*k,y:0};
    p.handF={x:16+6*k,y:-30+16*k}; p.handB={x:-15-6*k,y:-28+16*k};
    p.face='melt';
  } else if(st==='win'){
    const b = Math.sin(f.animT*0.18);
    p.bob = -Math.abs(b)*3;
    p.handF={x:8,y:-66-b*3}; p.handB={x:-8,y:-64+b*3};
    p.face = f.animT%120 < 60 ? 'smile' : 'wink';
  } else if(st==='attack'){
    const a = f.atk, m = a.m, tt = a.t;
    const total = m.startup + m.active + m.recover;
    const ph = tt < m.startup ? 'wind' : (tt < m.startup+Math.max(m.active,4) ? 'hit' : 'rec');
    const e = tt/total;
    p.face='smile';
    if(m.key==='light'){
      if(ph==='wind'){ p.handF={x:6,y:-56}; p.dx=1; }
      else if(ph==='hit'){ p.handF={x:24,y:-50}; p.dx=4; p.sh={x:3,y:-52}; p.head={x:3,y:-62}; }
      else { p.handF={x:16,y:-46}; p.dx=2; }
      p.handB={x:-8,y:-44};
      p.footF={x:12,y:0}; p.footB={x:-9,y:0};
    } else if(m.key==='med'){
      p.prop='bouquet';
      if(ph==='wind'){ p.handF={x:2,y:-58}; p.dx=-2; p.bob=2; }
      else if(ph==='hit'){ p.handF={x:30,y:-46}; p.dx=6; p.sh={x:4,y:-52}; p.head={x:4,y:-62}; p.footF={x:17,y:0}; }
      else { p.handF={x:20,y:-44}; p.dx=3; p.footF={x:14,y:0}; }
      p.handB={x:-9,y:-42};
      p.propPos = p.handF;
      if(ph==='rec') p.prop=null;
    } else if(m.key==='heavy'){
      if(ph==='wind'){ p.prop='choco'; p.handF={x:-6,y:-60}; p.dx=-3; p.bob=1; }
      else if(ph==='hit'){ p.handF={x:26,y:-54}; p.dx=5; p.sh={x:4,y:-52}; p.head={x:3,y:-62}; }
      else { p.handF={x:18,y:-48}; p.dx=2; }
      p.handB={x:-10,y:-40};
      p.footF={x:13,y:0}; p.footB={x:-11,y:0};
      p.propPos = p.handF;
    } else if(m.key==='super'){
      if(ph==='wind'){
        p.bob = 3 - e*6;
        p.handF={x:6,y:-64}; p.handB={x:-6,y:-62};
        p.face='wink';
      } else {
        p.handF={x:20,y:-64}; p.handB={x:-14,y:-58};
        p.dx = 5; p.face='smile';
      }
      p.footF={x:11,y:0}; p.footB={x:-11,y:0};
    }
  }
  return p;
}
function drawFighter(f, t){
  const c = f.char, pal = c.pal;
  const p = poseFor(f, t);
  const groundY = GROUND;
  // тень
  const h = groundY - f.y;
  const sw = clamp(26 - h*0.18, 10, 26);
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.fillRect(Math.round(f.x - sw/2), groundY-3, Math.round(sw), 3);

  ctx.save();
  ctx.translate(Math.round(f.x), Math.round(f.y));
  ctx.scale(f.facing, 1);
  ctx.translate(p.dx, p.bob);

  const hip = p.hip, sh = p.sh;
  const hipF = {x: hip.x+3, y: hip.y};
  const hipB = {x: hip.x-3, y: hip.y};
  const shF = {x: sh.x+4, y: sh.y+5};
  const shB = {x: sh.x-4, y: sh.y+5};

  // задняя нога и рука
  limb(hipB, {x:p.footB.x, y:p.footB.y-3}, 6, mix(pal.pants,'#000000',.25), -2, 0);
  R(p.footB.x-5, p.footB.y-4, 10, 4, mix(pal.shoe,'#000000',.2));
  limb(shB, p.handB, 5, mix(pal.coat,'#000000',.28), -3, 0);
  R(p.handB.x-2, p.handB.y-2, 5, 5, mix(pal.skin,'#000000',.15));

  // передняя нога
  limb(hipF, {x:p.footF.x, y:p.footF.y-3}, 7, pal.pants, 2, 0);
  R(p.footF.x-5, p.footF.y-4, 11, 4, pal.shoe);

  // корпус — наклоняется вокруг бедра, поэтому поклон выглядит поклоном
  const th = hip.y - sh.y;
  const lean = Math.atan2(sh.x - hip.x, Math.max(8, th));
  const tilted = Math.abs(lean) > 0.02;
  ctx.save();
  if(tilted){ ctx.translate(hip.x, hip.y); ctx.rotate(lean); ctx.translate(-hip.x, -hip.y); }
  const tx = hip.x;
  R(tx-10, sh.y, 20, th+3, pal.coat);
  R(tx-10, sh.y, 20, 4, mix(pal.coat,'#ffffff',.18));
  R(tx-2, sh.y+3, 4, th-2, pal.coat2);
  R(tx-10, hip.y-1, 20, 4, pal.pants);
  if(c.id==='stas'){ R(tx-10, sh.y+6, 20, 2, pal.acc); }
  if(c.id==='lena'){ R(tx-10, sh.y+8, 20, 2, pal.acc); R(tx+4, sh.y+12, 5, 5, pal.acc); }
  if(c.id==='bot'){ R(tx-5, sh.y+8, 10, 7, '#182236'); R(tx-3, sh.y+10, 6, 3, pal.acc); }
  if(c.id==='petrovich'){
    for(let i=0;i<3;i++) R(tx-10, sh.y+5+i*6, 20, 1, mix(pal.coat,'#000000',.35));
    for(let i=0;i<3;i++) R(tx-7+i*6, sh.y, 1, th+3, mix(pal.coat,'#000000',.35));
  }
  ctx.restore();

  // голова
  ctx.save();
  ctx.translate(p.head.x, p.head.y);
  faceDraw(pal, f.mood, p.face, f.animT);
  if(c.beard==='full'){ R(-8,2,16,7, pal.hair); R(-6,7,12,3, pal.hair); }
  if(c.beard==='stubble'){ ctx.fillStyle='rgba(60,50,60,.35)'; ctx.fillRect(-7,3,14,5); }
  if(c.id==='bot'){ R(-8,-4,16,5,'#0d1420'); R(-6,-3,12,3, pal.acc); }
  headGear(pal, c.head, f.animT);
  ctx.restore();

  // передняя рука + предмет
  limb(shF, p.handF, 5, pal.coat, 3, -1);
  R(p.handF.x-2, p.handF.y-2, 5, 5, pal.skin);
  if(p.prop==='bouquet') propBouquet(p.handF.x+5, p.handF.y-4, 1);
  if(p.prop==='choco') propChoco(p.handF.x+4, p.handF.y-2, -0.3);

  ctx.restore();

  // лужица при поражении
  if(f.state==='ko'){
    const k = clamp(f.animT/70,0,1);
    const w = 8 + k*40;
    ctx.fillStyle = 'rgba(255,143,180,.55)';
    ctx.fillRect(Math.round(f.x-w/2), GROUND-3, Math.round(w), 4);
    ctx.fillStyle = 'rgba(255,208,226,.7)';
    ctx.fillRect(Math.round(f.x-w/3), GROUND-4, Math.round(w*0.66), 2);
  }
  // реплика-комплимент
  if(f.bubble > 0 && f.line){
    bubble(f.line, f.x, f.y - 82, f.facing);
  }
}
function bubble(str, x, y, facing){
  const s = 1;
  const w = textW(str,s) + 10, h = 14;
  let bx = Math.round(x - w/2 + facing*10);
  bx = clamp(bx, 4, W-w-4);
  const by = Math.round(y);
  R(bx, by, w, h, '#fff6fb');
  R(bx-2, by+3, 2, h-6, '#fff6fb');
  R(bx+w, by+3, 2, h-6, '#fff6fb');
  R(bx+3, by-2, w-6, 2, '#fff6fb');
  R(bx+3, by+h, w-6, 2, '#fff6fb');
  R(Math.round(x+facing*6), by+h+1, 3, 4, '#fff6fb');
  text(str, bx+5, by+4, {scale:s, color:'#b4215a'});
}

/* ---------- 8. Частицы ---------- */
let particles = [];
function spawnHearts(x,y,n,col){
  for(let i=0;i<n;i++) particles.push({
    kind:'heart', x, y, vx:rnd(-1.4,1.4), vy:rnd(-2.4,-0.6), life:rnd(30,60), t:0,
    s: Math.random()<0.4 ? 2 : 1, col: col || pick(['#ff3d7f','#ff8fb4','#ffc93c','#fff0f6'])
  });
}
function spawnSparks(x,y,n,col){
  for(let i=0;i<n;i++) particles.push({
    kind:'spark', x, y, vx:rnd(-3,3), vy:rnd(-3,1), life:rnd(14,26), t:0, s:1, col
  });
}
function floatText(str,x,y,col,scale=1){
  particles.push({kind:'text', x, y, vx:0, vy:-0.7, life:52, t:0, str, col, s:scale});
}
function updateParticles(){
  for(const p of particles){
    p.t++; p.x += p.vx; p.y += p.vy;
    if(p.kind!=='text') p.vy += 0.06;
    if(p.kind==='spark') p.vy += 0.14;
  }
  particles = particles.filter(p=>p.t < p.life);
}
function drawParticles(){
  for(const p of particles){
    const fade = 1 - p.t/p.life;
    if(p.kind==='heart'){
      if(fade < 0.35 && Math.floor(p.t/3)%2) continue;
      heartPath(p.x, p.y, p.s, p.col);
    } else if(p.kind==='spark'){
      R(p.x, p.y, 2, 2, p.col);
    } else {
      if(fade < 0.4 && Math.floor(p.t/3)%2) continue;
      text(p.str, p.x, p.y, {align:'center', scale:p.s, color:p.col, outline:'#2a1030'});
    }
  }
}

function diffOf(){
  const i = game.arcadeIdx;
  return { react: [26,19,13][i]||12, block: [0.22,0.38,0.55][i]||0.55, aggr: [0.55,0.7,0.85][i]||0.85, jump: [0.05,0.09,0.13][i]||0.13 };
}
function aiThink(me, foe){
  const d = diffOf();
  const cmd = me.ai.cmd;
  for(const k in cmd) cmd[k] = false;
  if(me.state==='ko' || me.state==='win' || game.phase!=='fight'){ return; }
  const dist = Math.abs(foe.x - me.x);
  const dir = Math.sign(foe.x - me.x);
  me.ai.timer--;
  // реактивный блок
  if(foe.state==='attack' && dist < 70 && Math.random() < d.block*0.35) me.ai.plan = {type:'block', t:16};
  if(me.ai.plan && me.ai.plan.t>0){
    me.ai.plan.t--;
    const pl = me.ai.plan;
    if(pl.type==='block'){ cmd.block = true; return; }
    if(pl.type==='advance'){ if(dir>0) cmd.right=true; else cmd.left=true; return; }
    if(pl.type==='retreat'){ if(dir>0) cmd.left=true; else cmd.right=true; return; }
    if(pl.type==='wait'){ return; }
  }
  if(me.ai.timer > 0) return;
  me.ai.timer = 4 + Math.random()*d.react*0.5;
  const r = Math.random();
  if(me.meter >= 100 && dist < 70 && r < 0.65){ cmd.s = true; return; }
  const likesFlowers = foe.char.sex === 'f';
  if(dist < 58){
    if(r < 0.34*d.aggr) cmd.l = true;
    else if(r < 0.6*d.aggr){ if(likesFlowers) cmd.m = true; else cmd.h = true; }
    else if(r < 0.75) me.ai.plan = {type:'block', t:18+Math.random()*16};
    else me.ai.plan = {type:'retreat', t:14+Math.random()*14};
  } else if(dist < 110){
    if(r < 0.35*d.aggr) me.ai.plan = {type:'advance', t:12+Math.random()*14};
    else if(r < 0.6) cmd.h = true;
    else if(r < 0.72*d.aggr) me.ai.plan = {type:'advance', t:20};
    else me.ai.plan = {type:'wait', t:10+Math.random()*14};
  } else {
    if(r < 0.55) me.ai.plan = {type:'advance', t:20+Math.random()*20};
    else if(r < 0.8) cmd.h = true;
    else me.ai.plan = {type:'wait', t:12};
  }
}
function readInput(f){
  const i = f.input;
  for(const k in i) i[k] = false;
  if(f.cpu){
    const c = f.ai.cmd;
    i.left=c.left; i.right=c.right; i.up=c.up; i.block=c.block;
    i.l=c.l; i.m=c.m; i.h=c.h; i.s=c.s;
    // edge-эмуляция для ИИ (команды живут 1 кадр)
    c.l=c.m=c.h=c.s=false;
    return;
  }
  // левая рука ходит (WASD), правая дарит (стрелки, дубль на JKLI)
  i.left  = keys['KeyA'];
  i.right = keys['KeyD'];
  i.up    = keys['KeyW'];
  i.block = keys['KeyS'];
  i.l = pressed['ArrowLeft']  || pressed['KeyJ'];
  i.m = pressed['ArrowDown']  || pressed['KeyK'];
  i.h = pressed['ArrowRight'] || pressed['KeyL'];
  i.s = pressed['ArrowUp']    || pressed['KeyI'];
}
let projectiles = [];
function tryAttack(f, key, foe){
  if(f.state==='ko'||f.state==='win'||f.state==='hit') return;
  if(f.state==='attack') return;
  if(!f.onGround) return;
  const m = MOVES[key];
  if(m.cost && f.meter < m.cost) { SFX.back(); return; }
  if(m.cost) f.meter = 0;
  f.state='attack'; f.animT=0; f.vx=0;
  f.atk = {m, t:0, hit:false, key};
  if(key==='light'){
    const pool = COMPLIMENTS[(foe && foe.char.sex) || 'x'] || COMPLIMENTS.x;
    f.line = Math.random()<0.25 ? pick(f.char.lines) : pick(pool);
    f.bubble = m.startup + m.active + 12;
    SFX.light();
  } else if(key==='med'){ SFX.med(); }
  else if(key==='heavy'){ SFX.heavy(); }
  else { SFX.super(); game.flash = 12; setBanner(f.char.superName, '', 80, '#ff3d7f'); }
}
function applyHit(att, def, m, fromProj){
  const blocked = def.input.block && def.onGround && def.state!=='attack' && def.state!=='hit'
                  && Math.sign(att.x - def.x) === def.facing;
  const aff = (AFFINITY[m.key] || {})[def.char.sex] ?? 1;
  let dmg = m.dmg * charmMul(att) * stoicMul(def) * aff;
  if(blocked){
    dmg *= 0.16;
    def.meter = Math.min(100, def.meter + 9);
    att.meter = Math.min(100, att.meter + m.meter*0.5);
    def.vx = 1.0 * att.facing;
    SFX.block(); TG.haptic('rigid');
    spawnSparks(def.x - def.facing*14, def.y-48, 7, '#cfd6e8');
    floatText('ВЕЖЛИВЫЙ ПОКЛОН', def.x, def.y-92, '#9fd8ff', 1);
    game.shake = 2;
  } else {
    def.state='hit'; def.animT=0;
    def.stun = m.key==='super' ? 34 : (m.key==='light' ? 13 : (m.key==='med' ? 19 : 17));
    def.vx = m.push * att.facing;
    def.combo = 0;
    att.combo++; att.comboT = 70;
    att.meter = Math.min(100, att.meter + m.meter);
    def.meter = Math.min(100, def.meter + 5);
    SFX.hit();
    TG.haptic(m.key==='super' ? 'heavy' : (m.key==='light' ? 'light' : 'medium'));
    game.shake = m.key==='super' ? 9 : (m.key==='light' ? 2 : 4);
    game.hitstop = m.key==='super' ? 10 : (m.key==='light' ? 3 : 6);
    spawnHearts(def.x, def.y-54, m.key==='super' ? 16 : (m.key==='light'?4:8));
    floatText('+' + Math.round(dmg), def.x, def.y-88, '#ff8fb4', 1);
    if(aff >= 1.2) floatText('В САМОЕ СЕРДЦЕ!', def.x, def.y-104, '#ffc93c', 1);
    else if(aff <= 0.85) floatText(def.char.sex==='f' ? 'НЕ ЕЁ ТЕМА' : 'НЕ ЕГО ТЕМА',
                                   def.x, def.y-104, '#9b8ac2', 1);
    if(Math.random()<0.5 || m.key!=='light'){
      const line = def.mood > 70 ? pick(REACTIONS_HI) : pick(REACTIONS);
      def.line = line; def.bubble = 42;
    }
  }
  def.mood = Math.min(100, def.mood + dmg);
  att.dealt += dmg;
  game.score += Math.round(dmg * 10);
  if(def.mood >= 100 && def.state!=='ko') knockOut(def, att);
}
function knockOut(loser, winner){
  loser.state='ko'; loser.animT=0; loser.stun=0; loser.vx=0; loser.bubble=0;
  winner.state='win'; winner.animT=0; winner.atk=null;
  game.phase='ko'; game.phaseT=0;
  game.wins[winner.side]++;
  game.flash = 14; game.shake = 8;
  SFX.ko(); SFX.melt();
  TG.haptic('heavy');
  TG.notify(winner.side===0 ? 'success' : 'error');
  spawnHearts(loser.x, loser.y-50, 26);
  const matchOver = game.wins[winner.side] >= 2;
  setBanner(matchOver ? 'УМИЛИТИ!' : 'РАСТАЯЛ!', matchOver ? '' : '', 150, matchOver ? '#ff3d7f' : '#ffc93c');
  game.score += 1000 + Math.round(game.timer/60)*15 + (winner.mood===0 ? 1500 : 0);
}
function updateFighter(f, foe){
  f.animT++;
  if(f.comboT>0) f.comboT--; else f.combo = 0;
  if(f.bubble>0) f.bubble--;
  if(f.state==='ko'){ f.vx *= 0.85; f.x += f.vx; return; }
  if(f.state==='win'){ f.vx = 0; return; }
  if(game.phase!=='fight'){
    if(f.state!=='idle' && f.state!=='attack') f.state='idle';
    return;
  }
  readInput(f);
  const i = f.input;

  if(f.stun > 0){
    f.stun--;
    f.x += f.vx; f.vx *= 0.86;
    if(f.stun===0) f.state = 'idle';
  } else if(f.state==='attack'){
    const a = f.atk, m = a.m;
    a.t++;
    const total = m.startup + m.active + m.recover;
    if(m.kind==='melee' || m.kind==='super'){
      if(!a.hit && a.t >= m.startup && a.t <= m.startup + m.active){
        const dx = (foe.x - f.x) * f.facing;
        if(dx > -8 && dx < m.range && Math.abs(foe.y - f.y) < 52 && foe.state!=='ko'){
          a.hit = true;
          applyHit(f, foe, m, false);
          if(f.state==='win') return;
        }
      }
    } else if(m.kind==='proj'){
      if(!a.hit && a.t === m.startup){
        a.hit = true;
        projectiles.push({x: f.x + f.facing*16, y: f.y - 52, vx: 3.6*f.facing, vy:-1.1, owner:f, m, t:0, rot:0});
      }
    }
    if(a.t >= total){ f.state='idle'; f.atk=null; }
    f.x += f.vx; f.vx *= 0.8;
  } else {
    // движение
    if(!f.onGround){
      f.state = 'jump';
    } else if(i.block){
      f.state = 'block'; f.vx = 0;
    } else if(i.left || i.right){
      const sp = speedOf(f);
      const dir = i.left ? -1 : 1;
      f.vx = dir * sp * (dir === f.facing ? 1 : 0.78);
      f.state = 'walk';
    } else {
      f.vx = 0; f.state = 'idle';
    }
    if(i.up && f.onGround){ f.vy = -8.6; f.onGround = false; f.state='jump'; beep(600,.09,'square',.03,400); }
    if(f.onGround){
      if(i.s) tryAttack(f,'super',foe);
      else if(i.l) tryAttack(f,'light',foe);
      else if(i.m) tryAttack(f,'med',foe);
      else if(i.h) tryAttack(f,'heavy',foe);
    }
    f.x += f.vx;
  }
  // гравитация
  if(!f.onGround || f.y < GROUND){
    f.vy += 0.52; f.y += f.vy;
    if(f.y >= GROUND){ f.y = GROUND; f.vy = 0; f.onGround = true; if(f.state==='jump') f.state='idle'; }
  }
  // ориентация
  if(f.state!=='attack' && f.stun===0 && f.onGround){
    f.facing = foe.x >= f.x ? 1 : -1;
  }
  f.x = clamp(f.x, 28, W-28);
}
function separate(a,b){
  const d = b.x - a.x;
  const min = 30;
  if(Math.abs(d) < min && a.state!=='ko' && b.state!=='ko'){
    const push = (min - Math.abs(d))/2 * (d>=0?1:-1);
    a.x -= push; b.x += push;
    a.x = clamp(a.x, 28, W-28); b.x = clamp(b.x, 28, W-28);
  }
}
function updateProjectiles(){
  for(const p of projectiles){
    p.t++; p.x += p.vx; p.y += p.vy; p.vy += 0.035; p.rot += 0.22*Math.sign(p.vx);
    const foe = p.owner === game.p1 ? game.p2 : game.p1;
    if(foe.state!=='ko' && Math.abs(foe.x - p.x) < 20 && Math.abs((foe.y-46) - p.y) < 34){
      applyHit(p.owner, foe, p.m, true);
      p.dead = true;
      spawnSparks(p.x,p.y,6,'#d8b08a');
    }
    if(p.x < -20 || p.x > W+20 || p.y > GROUND){ p.dead = true; if(p.y>GROUND-2) spawnSparks(p.x,GROUND-4,5,'#5a3620'); }
  }
  projectiles = projectiles.filter(p=>!p.dead);
}

function drawMoodBar(f, side){
  const w = 150, h = 12, y = 12;

  R(x-2,y-2,w+4,h+4,'#120a1e');

  if(fill>0){
    const fx = side===0 ? x : x + w - fill;
    R(fx,y,fill,h, '#ff3d7f');
    R(fx,y,fill,4, mix('#ff8fb4','#fff0f6', pulse));
    R(fx,y+h-2,fill,2, '#b4215a');

  }
  R(x,y,w,1,'rgba(255,255,255,.25)');
  // имя и выигранные раунды в одну строку
  text(f.char.name, side===0 ? x : x+w, 2,

  for(let i=0;i<2;i++){

  }
}

function portrait(charDef, x, y, w, h, t, sel){

function wrapText(str, x, y, maxW, scale, color, maxLines){
  const words = str.split(' ');
  const lines = []; let cur = '';
  for(const w of words){
    const test = cur ? cur + ' ' + w : w;
    if(textW(test, scale) > maxW && cur){ lines.push(cur); cur = w; } else cur = test;
    if(lines.length >= maxLines) break;
  }
  if(cur && lines.length < maxLines) lines.push(cur);
  lines.forEach((l,i)=> text(l, x, y + i*9*scale, {scale, color}));
  return lines.length;
}

function screenFight(){
  const a = game.p1, b = game.p2;
  // --- обновление ---
  if(game.hitstop > 0){ game.hitstop--; }
  else {
    if(game.phase==='intro'){
      game.phaseT++;
      updateFighter(a,b); updateFighter(b,a);
      if(game.phaseT === 80) setBanner('ПОЕХАЛИ!', 'БЕЗ РУКОПРИКЛАДСТВА', 60, '#4ade8a');
      if(game.phaseT > 130){ game.phase='fight'; game.phaseT=0; }
    } else if(game.phase==='fight'){
      if(b.cpu) aiThink(b, a);
      updateFighter(a,b); updateFighter(b,a);
      separate(a,b);
      updateProjectiles();
      game.timer--;
      if(game.timer <= 0){
        // время вышло
        if(Math.abs(a.mood-b.mood) < 0.5){
          game.phase='ko'; game.phaseT=0;
          setBanner('НИЧЬЯ', 'ОБА СЛИШКОМ ДОБРЫЕ', 130, '#34dfff');
          a.state='win'; b.state='win'; a.animT=0; b.animT=0;
        } else {
          const loser = a.mood > b.mood ? a : b;
          const winner = loser===a ? b : a;
          loser.mood = 100;
          knockOut(loser, winner);
          setBanner('ВРЕМЯ ВЫШЛО', '', 130, '#ffc93c');
        }
      }
    } else if(game.phase==='ko'){
      game.phaseT++;
      updateFighter(a,b); updateFighter(b,a);
      updateProjectiles();
      if(game.phaseT === 60){
        const w = game.wins[0] >= 2 ? a : (game.wins[1] >= 2 ? b : null);
        if(w){
          setBanner('УМИЛИТИ!', w.char.win, 140, '#ff3d7f');
          spawnHearts(w.x, w.y-60, 20);
        }
      }
      if(game.phaseT > 170){
        if(game.wins[0] >= 2 || game.wins[1] >= 2){
          endMatch();
        } else {
          game.round++;
          startRound();
        }
      }
    }
    updateParticles();
    if(game.shake > 0) game.shake *= 0.86;
    if(game.flash > 0) game.flash--;
  }
  // --- рисование ---
  const sx = game.shake > 0.4 ? Math.round(rnd(-game.shake,game.shake)) : 0;
  const sy = game.shake > 0.4 ? Math.round(rnd(-game.shake,game.shake)*0.6) : 0;
  ctx.save();
  ctx.translate(sx, sy);
  drawStage(game.stage, game.t);
  drawCar(52, 1, a.char.pal.coat, game.t);
  drawCar(W-52, -1, b.char.pal.coat, game.t);
  // супер-эффект позади
  for(const f of [a,b]){
    if(f.state==='attack' && f.atk.key==='super' && f.atk.t > f.atk.m.startup - 8){
      const foe = f===a ? b : a;
      ctx.fillStyle = 'rgba(255,61,127,.18)'; ctx.fillRect(0,0,W,H);
      superIcon(f.char.superIcon, (f.x + foe.x)/2, 120, f.atk.t, f.char.pal);
      if(f.atk.t % 4 === 0) spawnHearts(foe.x + rnd(-20,20), foe.y - rnd(20,70), 1);
    }
  }
  const order = a.y <= b.y ? [a,b] : [b,a];
  drawFighter(order[0], game.t); drawFighter(order[1], game.t);
  for(const p of projectiles) propChoco(p.x, p.y, p.rot);
  drawParticles();
  ctx.restore();
  drawHUD();
  drawBanner();
  if(game.flash > 0){
    ctx.fillStyle = `rgba(255,240,250,${(game.flash/16*0.6).toFixed(2)})`;
    ctx.fillRect(0,0,W,H);
  }
  MUS.tick(game.phase==='ko' ? 'win' : 'fight');
  if(anyPressed(BACKK)){ SFX.back(); game.screen='title'; MUS.reset(); }
}
function endMatch(){
  const playerWon = game.wins[0] >= 2;
  if(game.mode==='versus'){
    game.screen='result'; game.phaseT=0; return;
  }
  if(playerWon){
    game.arcadeIdx++;
    if(game.arcadeIdx >= 3){ game.screen='ending'; game.phaseT=0; saveBest(); }
    else {
      game.sel2 = game.roster[game.arcadeIdx];
      game.stage = STAGES[(game.stageSel + game.arcadeIdx) % 4];
      game.p2 = makeFighter(FIGHTERS[game.sel2], 1, true);
      game.p1.wins = 0; game.wins=[0,0];
      game.screen='vs'; game.phaseT=0;
    }
  } else {
    game.screen='continue'; game.contTimer = 10*60; saveBest();
  }
}

  if(game.score > game.best){

  game.phaseT++;
  drawStage(game.stage, game.t);
  drawCar(W-52, -1, game.p1.char.pal.coat, game.t);
  // герой у колонки
  const hero = {...game.p1, x:300, y:GROUND, facing:-1, state:'win', animT:game.t, mood:0};
  drawFighter(hero, game.t);
  if(game.t % 10 === 0) spawnHearts(rnd(40,440), GROUND-rnd(20,120), 1);
  updateParticles(); drawParticles();
  ctx.fillStyle='rgba(10,4,20,.6)'; ctx.fillRect(0,0,W,H);
  text('БАК ПОЛОН', W/2, 26, {align:'center', scale:4, color:'#ffc93c', outline:'#4a2a00', shadow:'rgba(0,0,0,.5)', shadowDist:3});
  const story = [
    'ОЧЕРЕДЬ РАСТАЯЛА. БУКВАЛЬНО.',
    'ТРОЕ ВОДИТЕЛЕЙ СИДЯТ НА БОРДЮРЕ И ДЕЛЯТ ШОКОЛАДКУ.',
    'КАССИР ВЫДАЛ ЧЕК И ВТОРОЙ СТАКАНЧИК КОФЕ — ПРОСТО ТАК.'
  ];
  story.forEach((s,i)=> text(s, W/2, 74 + i*14, {align:'center', scale:1, color:'#e8dcff'}));
  R(90, 128, 300, 1, '#3a2a5e');
  text('ОЧКИ ОБАЯНИЯ', W/2, 138, {align:'center', scale:1, color:'#9b8ac2'});
  text(String(game.score).padStart(6,'0'), W/2, 152, {align:'center', scale:3, color:'#ff3d7f', outline:'#3a0a24'});
  text('РЕКОРД ' + String(game.best).padStart(6,'0'), W/2, 186, {align:'center', scale:1, color:'#ffc93c'});
  if(sendChip(198)){ sendResult(); return; }
  if(Math.floor(game.t/28)%2===0)
    text('НАЖМИ НА ЭКРАН — СНОВА В ОЧЕРЕДЬ', W/2, 232, {align:'center', scale:1, color:'#fff6fb'});
  MUS.tick('win');
  if(anyPressed(CONFIRM) || anyTap()){ SFX.pick(); game.screen='title'; game.score=0; resultSent=false; MUS.reset(); }
}

/* ---------- 12. Главный цикл ---------- */
function frame(){
  game.t++; cloudT += 0.35;
  ctx.fillStyle = '#06040c'; ctx.fillRect(0,0,W,H);
  switch(game.screen){
    case 'title': screenTitle(); break;
    case 'menu': screenMenu(); break;
    case 'how': screenHow(); break;
    case 'select': screenSelect(); break;
    case 'stage': screenStage(); break;
    case 'vs': screenVS(); break;
    case 'fight': screenFight(); break;
    case 'continue': screenContinue(); break;
    case 'result': screenResult(); break;
    case 'ending': screenEnding(); break;
  }
  document.documentElement.classList.toggle('playing', game.screen === 'fight');
  document.documentElement.classList.toggle('superready',
    game.screen === 'fight' && !!game.p1 && game.p1.meter >= 100 && game.p1.state !== 'ko');
  TG.syncBack(game.screen !== 'title');
  for(const k in pressed) delete pressed[k];
  taps.length = 0;
  requestAnimationFrame(frame);
}
layout();
requestAnimationFrame(frame);
</script>
